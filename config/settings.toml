[project]
name = "社情民意信息研究与生成工作流"
timezone = "Asia/Shanghai"
signature = "中关村支部：李智"
candidate_count = 5
max_formal_topics = 2
candidate_pool_days = 30
refresh_after_hours = 24

[model]
provider = "auto"
primary_provider = "codex_cli"
fallback_provider = "deepseek"
fallback_on = ["quota_exceeded", "rate_limited"]
screening_model = "gpt-5.4-mini"
codex_model = "gpt-5.4"
deepseek_model = "deepseek-v4-pro"
deepseek_thinking = true
deepseek_reasoning_effort = "max"
research_model = "mock-research"
writing_model = "mock-writing"
max_retries = 2
max_calls_per_action = 3
screening_max_output_tokens = 6000
codex_timeout_seconds = 420
screening_item_chars = 500
diagnostic_max_output_tokens = 1024
input_price_cny_per_million = 2.0
output_price_cny_per_million = 12.0
deepseek_input_price_cny_per_million = 3.0
deepseek_output_price_cny_per_million = 6.0

[discovery]
lookback_days = 90
scan_all_source_tiers = true
initial_min = 15
initial_max = 30
screened_min = 8
screened_max = 12
premodel_clue_reserve = 2
premodel_max_per_source = 2
premodel_external_reserve = 3
premodel_current_clue_reserve = 2
promotional_title_signals = ["专题讲座", "调研我区", "调研工作", "工作动态", "产业高地", "发展新图景", "织密扎牢", "民生答卷", "会议", "博览会"]
promotional_material_signals = ["机构参考", "点击咨询", "课程报名", "限时优惠", "咨询招生"]
premodel_fresh_reserve = 5
premodel_aged_reserve = 3
premodel_quality_min_sources = 4
premodel_quality_min_fresh = 4
premodel_quality_min_high_score = 4
premodel_quality_strong_aged_min = 8
premodel_quality_score_threshold = 60
candidate_count = 5
request_timeout_seconds = 20
max_parallel_fetches = 6
cache_ttl_hours = 6
user_agent = "sqmy-research/0.2 (+local policy research)"
title_similarity_threshold = 0.88
min_new_events_for_model = 4
pending_batch_max_wait_hours = 48
urgent_rule_score_threshold = 90
urgent_keywords = ["突发", "事故", "紧急", "重大风险", "征求意见", "专项通报"]

[observability]
enabled = true
exclusion_sample_per_stage = 2
rolling_evaluation_days = 21
minimum_live_runs_for_comparison = 3
minimum_observation_span_days = 14
source_health_zero_result_streak = 3
source_health_irrelevant_min_runs = 5
minimum_shadow_outcomes_for_assessment = 3

# 可选检索补充；无密钥、mock、fixture、回放和refresh不自动调用。
# 这是搜索积分/等价费用，不是模型Token，也不是账户实际账单。
[tavily]
enabled = true
max_searches_per_action = 4
max_results_per_query = 5
max_extracts_per_action = 2
# 显式绑定最新决策单才可补查；全部轮次共用上述请求数和下述积分上限。
max_repair_rounds = 2
max_repair_unknowns = 2
max_retries = 1
action_credit_limit = 10.0
action_cost_limit_usd = 0.08
credit_price_usd = 0.008
search_depth = "advanced"
extract_depth = "advanced"
basic_search_credits = 1.0
advanced_search_credits = 2.0
basic_extract_credits_per_five = 1.0
advanced_extract_credits_per_five = 2.0
request_timeout_seconds = 30
max_response_bytes = 2000000
cache_ttl_hours = 24
summary_chars = 700
excerpt_chars = 5000
context_chars = 350
# 每轮优先补当前RSS中尚少见的具体场景，同等条件按日期轮换。
# 不将全部RSS关键词再用Tavily重复检索。
scenario_queries = [
  { id = "medical", query = "中国 医院 检查检验互认 重复检查 患者 困难 调查", signals = ["重复检查", "检查检验互认"] },
  { id = "work", query = "中国 骑手 职业伤害 理赔 保险扣费 纠纷 调查", signals = ["职业伤害", "保险扣费"] },
  { id = "platform", query = "中国 平台 商家 保证金 申诉 退款 困难 调查", signals = ["保证金", "商家申诉"] },
  { id = "prepay", query = "中国 预付消费 闭店 退款 消费者 调查", signals = ["预付消费", "闭店退款"] },
  { id = "employment", query = "中国 求职 招聘 培训贷 退费 调查", signals = ["培训贷", "招聘陷阱"] },
  { id = "community", query = "中国 小区 消防维修 责任 维修资金 业主 困难", signals = ["消防维修", "维修资金"] },
  { id = "accessibility", query = "中国 残疾人 无障碍 服务办理 投诉 调查", signals = ["无障碍", "残疾人"] },
  # 2026-09-07单组试行：保留场景ID和轮换信号，仅聚焦具体办理过程；复盘见docs/candidate_entry_trial.md。
  { id = "public_service", query = "中国 老年人 异地就医 报销申请 材料反复提交 退回 处理结果 调查", signals = ["反复提交", "多头证明"] },
]

[history_review]
min_shared_subject = 4
min_shared_mechanism = 4
min_subject_ratio = 0.15
min_mechanism_ratio = 0.06
max_hints = 2
summary_chars = 160

[shadow_verification]
enabled = true
mode = "shadow"
max_events = 12
max_live_queries_per_run = 6
max_hits_per_query = 2
search_lookback_days = 730
original_title_similarity_threshold = 0.55
official_domains = ["bjhd.gov.cn", "beijing.gov.cn", "tjj.beijing.gov.cn", "bjcourt.gov.cn", "bjjc.gov.cn", "scjgj.beijing.gov.cn", "court.gov.cn", "jcy.gov.cn", "gov.cn"]
problem_signals = ["问题", "困难", "风险", "纠纷", "负担", "投诉", "不足", "短缺", "障碍", "争议"]
policy_signals = ["政策", "办法", "规定", "机制", "试点", "意见", "条例", "通知", "征求意见"]
data_signals = ["数据", "统计", "调查", "抽检", "同比", "环比", "占比"]
case_signals = ["案例", "案件", "判决", "司法建议", "检察建议", "处罚", "通报"]
coverage_signals = ["建立", "完善", "出台", "印发", "实施", "试点", "指引", "司法建议", "协同机制"]

[novelty]
enabled = true
audit_pool_size = 8
max_queries_per_candidate = 2
max_hits_per_query = 3
counterevidence_lookback_days = 730
local_mechanism_min_keyword_matches = 3
mechanism_max_age_days = 180
likely_covered_score_penalty = 12
potential_waste_tokens_per_block = 6000
rolling_evaluation_days = 21
minimum_audits_for_decision = 10
minimum_reviewed_blocks_for_precision = 3
minimum_observed_outcome_rate = 0.5
official_counterevidence_domains = ["beijing.gov.cn", "bjcourt.gov.cn", "court.gov.cn", "gov.cn", "bj148.org", "bjjubao.org.cn"]

[quality]
production_evaluation_weeks = 5
stable_production_weeks = 4
minimum_drafts_per_week = 1
stretch_drafts_per_week = 2

[writing_quality]
min_chars = 1200
max_chars = 1800
major_min_chars = 2000
major_max_chars = 2500
min_items = 3
max_items = 5
vague_phrases = ["高度重视", "进一步加强", "加大力度"]

[budget]
# Token硬闸门按单一有界行为计算；近7日用量只做观察和复盘。
weekly_cost_limit_cny = 100.0
screening_tokens = 55000
diagnostic_tokens = 30000
codex_cli_fixed_overhead_tokens = 15000
api_fixed_overhead_tokens = 1000
codex_cli_estimate_multiplier = 1.5
api_estimate_multiplier = 1.1
preflight_stale_running_hours = 2
pre_research_tokens = 30000
deep_research_tokens = 40000
writing_tokens = 15000

[scoring]
haidian_relevance = 15
beijing_relevance = 10
timeliness = 20
pain_authenticity = 15
policy_window = 15
data_verifiability = 10
operability = 10
mechanism_innovation = 5

[penalties]
policy_fully_covered = 15
repeated_without_new_mechanism = 10
weak_sources = 15
no_local_landing = 15
single_case_only = 10
high_fiscal_cost = 10
formalism_risk = 10
legal_conflict = 20
facts_unconfirmed = 20
no_executable_actor = 15

[evidence]
min_independent_origins = 2
blocking_statuses = ["unverified", "single_source", "conflicted", "needs_review", "rejected"]
official_primary_source_can_stand_alone = true
same_origin_reprints_count_once = true
novelty_requires_policy_coverage_audit = true
critical_source_max_age_days = 30

[snapshots]
max_bytes = 10000000
request_timeout_seconds = 20

[cleanup]
docx_qa_intermediate_retention_days = 7

