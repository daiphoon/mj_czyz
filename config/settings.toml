[budget]
weekly_token_limit = 120000
weekly_cost_limit_cny = 100.0
discovery_tokens = 15000
screening_tokens = 26000
codex_cli_fixed_overhead_tokens = 15000
api_fixed_overhead_tokens = 1000
preflight_stale_running_hours = 2
pre_research_tokens = 30000
deep_research_tokens = 40000
writing_tokens = 15000
reserve_tokens = 5000

[scoring]
haidian_relevance = 15
beijing_relevance = 10
timeliness = 20
pain_authenticity = 15
policy_window = 15
data_verifiability = 10
operability = 10
mechanism_innovation = 5

[penalties]
policy_fully_covered = 15
repeated_without_new_mechanism = 10
weak_sources = 15
no_local_landing = 15
single_case_only = 10
high_fiscal_cost = 10
formalism_risk = 10
legal_conflict = 20
facts_unconfirmed = 20
no_executable_actor = 15

[evidence]
