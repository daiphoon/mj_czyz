repeated_without_new_mechanism = 10
weak_sources = 15
no_local_landing = 15
single_case_only = 10
high_fiscal_cost = 10
formalism_risk = 10
legal_conflict = 20
facts_unconfirmed = 20
no_executable_actor = 15

[evidence]
min_independent_origins = 2
blocking_statuses = ["unverified", "single_source", "conflicted", "needs_review", "rejected"]
official_primary_source_can_stand_alone = true
same_origin_reprints_count_once = true
novelty_requires_policy_coverage_audit = true
critical_source_max_age_days = 30

[snapshots]
max_bytes = 10000000
request_timeout_seconds = 20

[cleanup]
docx_qa_intermediate_retention_days = 7

