[project]
name = "社情民意信息研究与生成工作流"
timezone = "Asia/Shanghai"
signature = "中关村支部：李智"
candidate_count = 5
max_formal_topics = 2

[model]
provider = "auto"
primary_provider = "codex_cli"
fallback_provider = "deepseek"
