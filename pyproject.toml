[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sqmy-workflow"
version = "0.1.0"
description = "本地、可恢复、可追溯的社情民意信息研究与生成工作流"
requires-python = ">=3.12"
dependencies = [
  "python-docx>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
openai = ["openai>=1.50,<2", "httpx>=0.27,<1"]

[project.scripts]
sqmy = "sqmy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
